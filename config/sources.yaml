# One entry per source plugin. The key is the module name in carscout/sources/.
# Adding a source = add carscout/sources/<name>.py (defining `Plugin`) + an entry here.
#
#   enabled:      false here disables the source everywhere (the UI toggle can't override it).
#                 When true, the toggle on the Sources page decides.
#   label:        display name
#   delay/jitter/concurrency: politeness overrides (seconds / parallel requests)
#   synthetic:    fake data, kept apart from real listings in dedupe and valuation
#   unavailable:  why the source can't be scraped (shown on the Sources page)
#   options:      plugin-specific settings
#
# This file is re-read at the start of every run, so edits apply without a restart.

sources:
  carsales:
    label: Carsales
    enabled: true
    delay: 6
    jitter: 4
    options:
      # Only the first page of each search path is served without a captcha, so a search fans
      # out over a few paths (states, then body style / transmission splits).
      max_pages: 8                       # requests per search per run
      split_by: [state, bodystyle, transmission]

  gumtree:
    label: Gumtree
    enabled: true
    implemented: false
    unavailable: >-
      Gumtree serves a Peakhour bot challenge (HTTP 403) to every request, including headless
      Chromium (checked 2026-11-01). CarScout doesn't get around bot protection.

  cars24:
    label: Cars24
    enabled: true
    delay: 3             # robots.txt asks for Crawl-delay: 2
    jitter: 2
    options:
      max_pages: 15            # 20 cars a page; stops early (and skips the gone-check) beyond this
      detail_max_age_days: 7   # re-fetch a car's detail page at least this often

  drive:
    label: Drive
    enabled: true
    implemented: false
    unavailable: >-
      Drive serves a Cloudflare Turnstile challenge to every request, even robots.txt, including
      headless Chromium (checked 2026-11-01). CarScout doesn't get around bot protection.

  facebook:
    label: Facebook Marketplace
    enabled: false
    implemented: false
    unavailable: >-
      facebook.com's robots.txt disallows every page to general crawlers, and Meta prohibits
      automated data collection without its written permission (checked 2026-11-01). There is no
      public Marketplace listings API, so CarScout doesn't collect from Facebook.

  demo:
    label: Demo (fake data)
    synthetic: true      # fake listings: never used as comparables or matched with real cars
    enabled: true        # also needs the toggle on the Sources page; off there by default
    delay: 0
    jitter: 0
    options:
      count: 12          # listings per run
      mode: ok           # ok | blocked | error  (to test degraded handling)
