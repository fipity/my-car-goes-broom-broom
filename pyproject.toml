[project]
name = "carscout"
version = "1.0.0"
description = "Self-hosted Australian used-car listings aggregator with market valuation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "httpx>=0.28",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carscout*"]

[tool.setuptools.package-data]
carscout = ["web/templates/*.html", "web/static/*", "normalise/data/*.yaml", "geo/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
